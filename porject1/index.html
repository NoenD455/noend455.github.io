<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flow Matching ONNX Browser Inference</title>
<style>
  :root {
    --bg: #1a1a1a; --panel: #242424; --border: #3a3a3a;
    --text: #e8e8e8; --muted: #999;
    --accent: #4a7eb5; --accent-hover: #5a8ec5;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 24px; line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 8px 0; font-size: 22px; font-weight: 600; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 16px; margin-bottom: 16px;
  }
  .panel h2 {
    margin: 0 0 12px 0; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted);
  }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  input, select, button {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }
  input[type="number"] { width: 84px; }
  button {
    cursor: pointer; background: var(--accent); border-color: var(--accent);
    font-weight: 500; transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: transparent; border-color: var(--border); }
  button.secondary:hover:not(:disabled) { background: var(--border); }
  select { min-width: 260px; }
  #modelInfo {
    margin-top: 12px; font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-word;
  }
  #status {
    margin-top: 12px; padding: 10px 12px; background: var(--bg);
    border-radius: 6px; font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px; min-height: 20px; color: var(--muted);
  }
  #status.active { color: var(--text); }
  #progressWrap {
    margin-top: 8px; height: 6px; background: var(--bg);
    border-radius: 3px; overflow: hidden; display: none;
  }
  #progressBar {
    height: 100%; width: 0%; background: var(--accent);
    transition: width 0.1s linear;
  }
  #canvasWrap {
    text-align: center; padding: 16px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px;
    min-height: 200px; display: flex; align-items: center; justify-content: center;
  }
  #canvas { image-rendering: pixelated; border-radius: 4px; max-width: 100%; display: block; }
  #emptyHint { color: var(--muted); font-size: 13px; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">

  <h1>Flow Matching to ONNX to Browser</h1>
  <div class="subtitle">
    Velocity UNet exported from flow_api.py, ODE integrated in JavaScript.
    Unconditional generation (cond = 0).
  </div>

  <!-- Model -->
  <div class="panel">
    <h2>1 · Model</h2>
    <div class="row">
      <label>Model
        <select id="modelSelect" disabled>
          <option value="">Loading manifest…</option>
        </select>
      </label>
      <button id="loadBtn" disabled>Load</button>
      <button id="fileBtn" class="secondary" disabled>Use local file…</button>
      <input type="file" id="modelFile" accept=".onnx" hidden>
    </div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div id="modelInfo">No model loaded.</div>
  </div>

  <!-- Settings -->
  <div class="panel">
    <h2>2 · Sampling</h2>
    <div class="row">
      <label>Steps <input type="number" id="steps" value="50" min="1" max="1000"></label>
      <label>Sampler
        <select id="sampler">
          <option value="euler" selected>Euler</option>
          <option value="heun">Heun (2nd order)</option>
          <option value="midpoint">Midpoint (2nd order)</option>
          <option value="rk4">RK4 (4th order)</option>
        </select>
      </label>
      <label>Batch <input type="number" id="batch" value="4" min="1" max="16"></label>
      <label>Seed <input type="number" id="seed" value="42"></label>
    </div>
    <div class="row">
      <button id="generateBtn" disabled>Generate</button>
      <button id="cancelBtn" class="secondary" disabled>Cancel</button>
    </div>
    <div id="status">Loading model manifest…</div>
  </div>

  <!-- Output -->
  <div id="canvasWrap">
    <div id="emptyHint">Generated images will appear here.</div>
    <canvas id="canvas" hidden></canvas>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.1/dist/ort.min.js"></script>
<script>
// ============================================================
// ORT setup
ort.env.wasm.wasmPaths = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.24.1/dist/';
ort.env.wasm.numThreads = 1;

// ============================================================
// State
let session = null;
let io = null;               // { xName, tName, condName, outName, C, H, W, condDim }
let cancelRequested = false;

// ============================================================
// Helpers
function setStatus(msg, active = false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.toggle('active', active);
}

function mulberry32(seed) {
  return function() {
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function normalArray(n, seed) {
  const rng = mulberry32(seed >>> 0);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i += 2) {
    const u1 = 1 - rng();
    const u2 = rng();
    const r  = Math.sqrt(-2 * Math.log(u1));
    const a  = 2 * Math.PI * u2;
    out[i] = r * Math.cos(a);
    if (i + 1 < n) out[i + 1] = r * Math.sin(a);
  }
  return out;
}

function setProgress(pct) {
  const wrap = document.getElementById('progressWrap');
  const bar  = document.getElementById('progressBar');
  if (pct == null) { wrap.style.display = 'none'; bar.style.width = '0%'; return; }
  wrap.style.display = 'block';
  bar.style.width = Math.max(0, Math.min(100, pct)) + '%';
}

// ============================================================
//  Load models.json and populate the dropdown
async function loadManifest() {
  const sel = document.getElementById('modelSelect');
  try {
    const resp = await fetch('models.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error(`models.json → HTTP ${resp.status}`);
    const manifest = await resp.json();
    if (!manifest.models || !manifest.models.length) {
      throw new Error('models.json has no "models" array');
    }
    sel.innerHTML = '';
    for (const m of manifest.models) {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name || m.id;
      opt._model = m;   // keep full descriptor on the option
      sel.appendChild(opt);
    }
    sel.disabled = false;
    document.getElementById('loadBtn').disabled = false;
    document.getElementById('fileBtn').disabled = false;
    setStatus(`Loaded manifest with ${manifest.models.length} model(s).`);
  } catch (err) {
    console.error(err);
    sel.innerHTML = '<option value="">(could not load models.json)</option>';
    document.getElementById('fileBtn').disabled = false;
    setStatus(`Manifest error: ${err.message} — you can still use a local file.`);
  }
}

// ============================================================
//  Fetch a model with a progress bar
async function fetchWithProgress(url) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);

  const total = parseInt(resp.headers.get('content-length') || '0', 10);
  if (!resp.body || total === 0) {
    // no streaming available or length unknown
    return await resp.arrayBuffer();
  }

  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    setProgress((received / total) * 100);
  }
  const buf = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { buf.set(c, off); off += c.length; }
  return buf.buffer;
}

// ============================================================
// 3) Load a model given a descriptor
async function loadModelFromDescriptor(desc, sourceLabel) {
  document.getElementById('generateBtn').disabled = true;
  session = null;
  io = null;
  setProgress(0);
  setStatus(`Downloading ${sourceLabel}…`, true);
  document.getElementById('modelInfo').textContent = 'Loading…';

  try {
    let buf;
    if (desc._localFile) {
      buf = await desc._localFile.arrayBuffer();
    } else {
      buf = await fetchWithProgress(desc.url);
    }
    setProgress(null);

    setStatus('Initialising ONNX runtime…', true);
    session = await ort.InferenceSession.create(buf, {
      executionProviders: ['wasm'],
    });

    // values from the manifest; fall back to runtime names / defaults.
    const inNames = (session.inputNames && session.inputNames.length)
      ? session.inputNames : ['x', 't', 'cond'];
    const outName = (session.outputNames && session.outputNames[0])
      || desc.outName || 'velocity';

    io = {
      xName:    desc.xName    || inNames[0] || 'x',
      tName:    desc.tName    || inNames[1] || 't',
      condName: desc.condName || inNames[2] || 'cond',
      outName,
      C:       desc.C,
      H:       desc.H,
      W:       desc.W,
      condDim: desc.condDim,
    };

    document.getElementById('modelInfo').textContent =
      `✓ ${sourceLabel}\n` +
      `  ${io.xName}:    [B, ${io.C}, ${io.H}, ${io.W}]\n` +
      `  ${io.tName}:    [B]\n` +
      `  ${io.condName}: [B, ${io.condDim}]\n` +
      `  ${io.outName}:  [B, ${io.C}, ${io.H}, ${io.W}]`;

    setStatus(`Ready. ${io.C}×${io.H}×${io.W}, cond_dim=${io.condDim}.`);
    document.getElementById('generateBtn').disabled = false;
  } catch (err) {
    console.error(err);
    setProgress(null);
    setStatus(`Error: ${err.message}`);
    document.getElementById('modelInfo').textContent = 'Load failed.';
  }
}

// ============================================================
//  Wire up UI
document.getElementById('loadBtn').addEventListener('click', () => {
  const sel = document.getElementById('modelSelect');
  const opt = sel.selectedOptions[0];
  if (!opt || !opt._model) return;
  loadModelFromDescriptor(opt._model, opt._model.name || opt._model.id);
});

document.getElementById('fileBtn').addEventListener('click', () => {
  document.getElementById('modelFile').click();
});

document.getElementById('modelFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // selected model's shape as a template, or ask the user.
  const sel = document.getElementById('modelSelect');
  const opt = sel && sel.selectedOptions[0];
  let template = opt && opt._model ? { ...opt._model } : null;
  if (!template) {
    const C = prompt('Channels (C):', '3');
    const H = prompt('Height (H):', '32');
    const W = prompt('Width (W):',  '32');
    const D = prompt('cond_dim:',   '256');
    template = { C: +C, H: +H, W: +W, condDim: +D };
  }
  template._localFile = file;
  template.name = file.name;

  loadModelFromDescriptor(template, file.name + ' (local)');
  e.target.value = ''; // allow re-picking the same file
});

// ============================================================
//  Inference: one UNet forward pass
async function predictVelocity(x, tVal, cond, batch) {
  const { xName, tName, condName, outName, C, H, W, condDim } = io;
  const tArr = new Float32Array(batch);
  tArr.fill(tVal);

  const feeds = {};
  feeds[xName]    = new ort.Tensor('float32', x,    [batch, C, H, W]);
  feeds[tName]    = new ort.Tensor('float32', tArr, [batch]);
  feeds[condName] = new ort.Tensor('float32', cond, [batch, condDim]);

  const results = await session.run(feeds);
  return results[outName].data;
}

// ============================================================
//  Generation loop
async function generate() {
  if (!session || !io) return;

  cancelRequested = false;
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('cancelBtn').disabled = false;

  const t0 = performance.now();

  try {
    const steps   = Math.max(1, parseInt(document.getElementById('steps').value, 10) || 50);
    const batch   = Math.max(1, parseInt(document.getElementById('batch').value, 10) || 1);
    const seed    = parseInt(document.getElementById('seed').value, 10) || 0;
    const sampler = document.getElementById('sampler').value;

    const { C, H, W, condDim } = io;
    const total = batch * C * H * W;

    setStatus('Initialising noise…', true);
    let x = normalArray(total, seed);
    const cond = new Float32Array(batch * condDim);

    const dt = 1 / steps;
    let lastYield = performance.now();

    for (let i = 0; i < steps; i++) {
      if (cancelRequested) { setStatus('Cancelled.'); return; }
      const tCur = i / steps;

      if (sampler === 'euler') {
        const v = await predictVelocity(x, tCur, cond, batch);
        for (let j = 0; j < total; j++) x[j] += v[j] * dt;
      }
      else if (sampler === 'heun') {
        const v1 = await predictVelocity(x, tCur, cond, batch);
        const xp = new Float32Array(total);
        for (let j = 0; j < total; j++) xp[j] = x[j] + v1[j] * dt;
        const v2 = await predictVelocity(xp, tCur + dt, cond, batch);
        for (let j = 0; j < total; j++) x[j] += (v1[j] + v2[j]) * 0.5 * dt;
      }
      else if (sampler === 'midpoint') {
        const v1 = await predictVelocity(x, tCur, cond, batch);
        const xm = new Float32Array(total);
        for (let j = 0; j < total; j++) xm[j] = x[j] + v1[j] * dt * 0.5;
        const vm = await predictVelocity(xm, tCur + dt * 0.5, cond, batch);
        for (let j = 0; j < total; j++) x[j] += vm[j] * dt;
      }
      else if (sampler === 'rk4') {
        const v1 = await predictVelocity(x, tCur, cond, batch);
        const x2 = new Float32Array(total);
        for (let j = 0; j < total; j++) x2[j] = x[j] + v1[j] * dt * 0.5;
        const v2 = await predictVelocity(x2, tCur + dt * 0.5, cond, batch);
        const x3 = new Float32Array(total);
        for (let j = 0; j < total; j++) x3[j] = x[j] + v2[j] * dt * 0.5;
        const v3 = await predictVelocity(x3, tCur + dt * 0.5, cond, batch);
        const x4 = new Float32Array(total);
        for (let j = 0; j < total; j++) x4[j] = x[j] + v3[j] * dt;
        const v4 = await predictVelocity(x4, tCur + dt, cond, batch);
        for (let j = 0; j < total; j++) {
          x[j] += (v1[j] + 2*v2[j] + 2*v3[j] + v4[j]) * dt / 6;
        }
      }

      const elapsed = (performance.now() - t0) / 1000;
      setStatus(`Step ${i + 1} / ${steps}  —  ${elapsed.toFixed(1)}s`, true);

      if (performance.now() - lastYield > 30) {
        await new Promise(r => setTimeout(r, 0));
        lastYield = performance.now();
      }
    }

    setStatus('Rendering…', true);
    drawBatch(x, batch, C, H, W);
    setStatus(`Done in ${((performance.now() - t0) / 1000).toFixed(1)}s ✓`);
  }
  catch (err) {
    console.error(err);
    setStatus(`Error: ${err.message}`);
  }
  finally {
    document.getElementById('generateBtn').disabled = false;
    document.getElementById('cancelBtn').disabled = true;
  }
}

// ============================================================
//  Rendering
function drawBatch(x, batch, C, H, W) {
  const canvas = document.getElementById('canvas');
  const hint   = document.getElementById('emptyHint');
  const ctx    = canvas.getContext('2d');

  const cols  = Math.max(1, Math.ceil(Math.sqrt(batch)));
  const rows  = Math.ceil(batch / cols);
  const scale = Math.max(2, Math.floor(640 / (cols * W)));
  const iw = W * scale, ih = H * scale, pad = 6;

  canvas.width  = cols * iw + (cols + 1) * pad;
  canvas.height = rows * ih + (rows + 1) * pad;
  canvas.hidden = false;
  hint.hidden = true;

  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = false;

  const plane = H * W;

  for (let b = 0; b < batch; b++) {
    const col = b % cols, row = (b / cols) | 0;
    const ox  = pad + col * (iw + pad);
    const oy  = pad + row * (ih + pad);

    const imgData = ctx.createImageData(W, H);
    const base = b * C * plane;

    for (let y = 0; y < H; y++) {
      for (let px = 0; px < W; px++) {
        const i = y * W + px;
        let r, g, bl;
        if (C >= 3) {
          r  = (x[base + 0 * plane + i] + 1) * 127.5;
          g  = (x[base + 1 * plane + i] + 1) * 127.5;
          bl = (x[base + 2 * plane + i] + 1) * 127.5;
        } else {
          r = g = bl = (x[base + i] + 1) * 127.5;
        }
        const p = i * 4;
        imgData.data[p]     = Math.max(0, Math.min(255, r));
        imgData.data[p + 1] = Math.max(0, Math.min(255, g));
        imgData.data[p + 2] = Math.max(0, Math.min(255, bl));
        imgData.data[p + 3] = 255;
      }
    }

    const tmp = document.createElement('canvas');
    tmp.width = W; tmp.height = H;
    tmp.getContext('2d').putImageData(imgData, 0, 0);
    ctx.drawImage(tmp, ox, oy, iw, ih);
  }
}

// ============================================================
//  Buttons & startup
document.getElementById('generateBtn').addEventListener('click', generate);
document.getElementById('cancelBtn').addEventListener('click', () => {
  cancelRequested = true;
  setStatus('Cancelling…', true);
});

loadManifest();
</script>
</body>
</html>
